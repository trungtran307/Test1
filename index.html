<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catch the Dot 🎯</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(720px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 18px 50px #18243a18}
h1{margin:0 0 6px;font-size:clamp(28px,6vw,44px)}p{margin:0;color:#647087}
.top{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{flex:1;min-width:110px;background:#f1f4f9;border-radius:14px;padding:12px 14px}.stat b{display:block;font-size:24px;margin-top:3px}
button{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:#e91e3a;color:#fff}button:hover{filter:brightness(.95)}
#game{position:relative;height:min(58vh,420px);min-height:320px;background:linear-gradient(135deg,#151c32,#293657);border-radius:20px;overflow:hidden;touch-action:manipulation}
#target{position:absolute;width:58px;height:58px;border-radius:50%;display:none;place-items:center;background:#ff3d5a;box-shadow:0 8px 22px #0005;color:#fff;font-size:25px;font-weight:900;user-select:none}
#message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:30px}.messageBox{background:#0006;padding:20px 24px;border-radius:18px;backdrop-filter:blur(8px)}
.small{font-size:13px;color:#9aa6bc;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<h1>🎯 Catch the Dot</h1><p>Chạm vào chấm đỏ càng nhiều càng tốt trong 30 giây.</p>
<div class="top">
<div class="stat">Điểm<b id="score">0</b></div><div class="stat">Thời gian<b><span id="time">30</span>s</b></div>
<button id="start">Bắt đầu</button>
</div>
<section id="game" aria-label="Khu vực chơi">
<div id="message"><div class="messageBox"><strong>Sẵn sàng?</strong><br><span class="small">Nhấn “Bắt đầu” để chơi.</span></div></div>
<div id="target">+</div>
</section>
<p class="small">Mẹo: chấm xuất hiện ngẫu nhiên — phản xạ nhanh để đạt điểm cao!</p>
</main>
<script>
const game=document.querySelector('#game'),target=document.querySelector('#target'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),start=document.querySelector('#start'),message=document.querySelector('#message');
let score=0,time=30,timer=null,playing=false;
function move(){const pad=8,w=target.offsetWidth,h=target.offsetHeight;const x=pad+Math.random()*(game.clientWidth-w-pad*2),y=pad+Math.random()*(game.clientHeight-h-pad*2);target.style.left=x+'px';target.style.top=y+'px';}
function end(){playing=false;clearInterval(timer);target.style.display='none';message.style.display='grid';message.innerHTML='<div class="messageBox"><strong>Hết giờ! 🎉</strong><br>Bạn đạt <b>'+score+'</b> điểm.<br><span class="small">Nhấn “Chơi lại” để thử lần nữa.</span></div>';start.textContent='Chơi lại';}
function begin(){score=0;time=30;playing=true;scoreEl.textContent=score;timeEl.textContent=time;message.style.display='none';target.style.display='grid';start.textContent='Đang chơi…';move();clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000);}
target.addEventListener('pointerdown',e=>{if(!playing)return;e.preventDefault();score++;scoreEl.textContent=score;move();});
start.addEventListener('click',begin);
</script>
</body>
</html>
